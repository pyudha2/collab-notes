name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            realtime-server/package-lock.json

      - name: Install web
        working-directory: web
        run: npm ci

      - name: Build web
        working-directory: web
        run: npm run build
        env:
          NEXT_PUBLIC_SOCKET_URL: http://localhost:4000

      - name: Install realtime-server
        working-directory: realtime-server
        run: npm ci

      - name: Prisma generate
        working-directory: realtime-server
        run: npx prisma generate
        env:
          DATABASE_URL: mysql://user:pass@localhost:3306/db

      - name: Typecheck realtime-server
        working-directory: realtime-server
        run: npx tsc --noEmit

      - name: Presence check
        working-directory: realtime-server
        run: npm run check